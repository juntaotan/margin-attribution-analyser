name: margin-attribution-dev

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: margin_attribution
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "${DEV_POSTGRES_PORT:-15432}:5432"
    volumes:
      - margin_dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
    ports:
      - "${DEV_MINIO_API_PORT:-19000}:9000"
      - "${DEV_MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - margin_dev_minio_data:/data

  onlyoffice:
    image: onlyoffice/documentserver:latest
    restart: unless-stopped
    shm_size: 2gb
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?Set ONLYOFFICE_JWT_SECRET in .env}
      JWT_HEADER: AuthorizationJwt
      JWT_IN_BODY: "true"
      ALLOW_PRIVATE_IP_ADDRESS: "true"
    ports:
      - "${DEV_ONLYOFFICE_PORT:-18082}:80"
    volumes:
      - margin_dev_onlyoffice_data:/var/www/onlyoffice/Data
      - margin_dev_onlyoffice_logs:/var/log/onlyoffice
      - margin_dev_onlyoffice_lib:/var/lib/onlyoffice
      - margin_dev_onlyoffice_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  backend:
    image: maven:3.9.16-eclipse-temurin-21
    init: true
    working_dir: /workspace
    command: mvn spring-boot:run
    environment:
      DB_URL: jdbc:postgresql://100.93.141.50:5432/margin_attribution
      DB_USERNAME: postgres
      DB_PASSWORD: ${REMOTE_DB_PASSWORD:?Set REMOTE_DB_PASSWORD in .env}
      SPRING_FLYWAY_TARGET: "2"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
      MINIO_RAW_BUCKET: ${MINIO_RAW_BUCKET:-margin-raw}
      LLAMA_BASE_URL: ${LLAMA_BASE_URL:-http://host.docker.internal:8081}
      LLAMA_MODEL: ${LLAMA_MODEL:-local}
      ONLYOFFICE_INTERNAL_URL: http://onlyoffice
      ONLYOFFICE_BACKEND_INTERNAL_URL: http://backend:8080
      MINIO_REPORT_BUCKET: ${MINIO_REPORT_BUCKET:-margin-reports}
      ONLYOFFICE_PUBLIC_URL: ${ONLYOFFICE_PUBLIC_URL:-http://localhost:18082}
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?Set ONLYOFFICE_JWT_SECRET in .env}
    ports:
      - "${DEV_BACKEND_PORT:-18080}:8080"
    volumes:
      - ./backend:/workspace:Z
      - margin_dev_maven_cache:/root/.m2
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

volumes:
  margin_dev_postgres_data:
  margin_dev_minio_data:
  margin_dev_maven_cache:
  margin_dev_onlyoffice_data:
  margin_dev_onlyoffice_logs:
  margin_dev_onlyoffice_lib:
  margin_dev_onlyoffice_postgres:
