spring.application.name=margin-attribution-backend
server.port=8090

# PostgreSQL connection
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/margin_attribution}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# MinIO
datalake.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
datalake.access-key=${MINIO_ACCESS_KEY:minioadmin}
datalake.secret-key=${MINIO_SECRET_KEY:minioadmin}
datalake.raw-bucket=${MINIO_RAW_BUCKET:margin-raw}