spring.application.name=margin-attribution-backend

# PostgreSQL connection
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# MinIO
datalake.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
datalake.access-key=${MINIO_ACCESS_KEY}
datalake.secret-key=${MINIO_SECRET_KEY}
datalake.raw-bucket=${MINIO_RAW_BUCKET:margin-raw}