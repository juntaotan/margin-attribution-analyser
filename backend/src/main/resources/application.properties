spring.application.name=margin-attribution-backend
server.port=8090

# Allow generated manufacturing workbooks while keeping uploads bounded.
spring.servlet.multipart.max-file-size=${IMPORT_MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${IMPORT_MAX_REQUEST_SIZE:25MB}

# PostgreSQL connection
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/margin_attribution}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# MinIO
datalake.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
datalake.access-key=${MINIO_ACCESS_KEY:minioadmin}
datalake.secret-key=${MINIO_SECRET_KEY:minioadmin}
datalake.raw-bucket=${MINIO_RAW_BUCKET:margin-raw}

# Local llama-server (OpenAI-compatible endpoint)
analysis.llama.base-url=${LLAMA_BASE_URL:http://127.0.0.1:8081}
analysis.llama.model=${LLAMA_MODEL:local}
# ONLYOFFICE Document Server
onlyoffice.internal-url=${ONLYOFFICE_INTERNAL_URL:http://localhost:18082}
onlyoffice.public-url=${ONLYOFFICE_PUBLIC_URL:http://localhost:18082}
onlyoffice.backend-internal-url=${ONLYOFFICE_BACKEND_INTERNAL_URL:http://host.docker.internal:8090}
onlyoffice.jwt-secret=${ONLYOFFICE_JWT_SECRET:development-onlyoffice-secret-change-me}
onlyoffice.report-bucket=${MINIO_REPORT_BUCKET:margin-reports}

# Optional, explicitly installed local embedding runtime; no automatic model download.
margin.embedding.python=${EMBEDDING_PYTHON:}
margin.embedding.model=${EMBEDDING_MODEL:}
margin.embedding.revision=${EMBEDDING_REVISION:}
margin.embedding.timeout-seconds=${EMBEDDING_TIMEOUT_SECONDS:60}
# Keep stage streaming open for explicitly bounded long-running analysis.
spring.mvc.async.request-timeout=${ANALYSIS_STREAM_TIMEOUT_MS:600000}
