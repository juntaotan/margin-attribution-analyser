services:
  postgres:
    image: postgres:17
    container_name: margin-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: margin_attribution
      POSTGRES_USER: margin_user
      POSTGRES_PASSWORD: margin_password

    ports:
      - "5432:5432"

    volumes:
      - margin_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U margin_user -d margin_attribution"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  margin_postgres_data: