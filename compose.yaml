x-pgbackrest-environment: &pgbackrest-environment
  PGBACKREST_STANZA: ${BACKUP_STANZA:-margin-prod}
  PGBACKREST_PG1_PATH: /var/lib/postgresql/data
  PGBACKREST_REPO1_TYPE: s3
  PGBACKREST_REPO1_PATH: ${BACKUP_S3_REPOSITORY_PATH:-/production/margin-attribution}
  PGBACKREST_REPO1_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
  PGBACKREST_REPO1_STORAGE_PORT: ${BACKUP_S3_PORT:-443}
  PGBACKREST_REPO1_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
  PGBACKREST_REPO1_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
  PGBACKREST_REPO1_S3_KEY_TYPE: shared
  PGBACKREST_REPO1_S3_KEY: ${BACKUP_S3_ACCESS_KEY:-}
  PGBACKREST_REPO1_S3_KEY_SECRET: ${BACKUP_S3_SECRET_KEY:-}
  PGBACKREST_REPO1_S3_URI_STYLE: ${BACKUP_S3_URI_STYLE:-path}
  PGBACKREST_REPO1_STORAGE_VERIFY_TLS: ${BACKUP_S3_TLS_VERIFY:-y}
  PGBACKREST_REPO1_CIPHER_TYPE: aes-256-cbc
  PGBACKREST_REPO1_CIPHER_PASS: ${BACKUP_REPOSITORY_CIPHER_PASS:-}
  PGBACKREST_REPO1_RETENTION_FULL_TYPE: time
  PGBACKREST_REPO1_RETENTION_FULL: ${BACKUP_RETENTION_DAYS:-28}
  PGBACKREST_COMPRESS_TYPE: zst
  PGBACKREST_START_FAST: y
  PGBACKREST_LOG_LEVEL_CONSOLE: info
  PGBACKREST_LOG_LEVEL_FILE: detail
  PGBACKREST_LOG_PATH: /var/log/pgbackrest
  PGBACKREST_SPOOL_PATH: /var/spool/pgbackrest

services:
  postgres:
    build:
      context: ./postgres
    image: margin-postgres:17-pgbackrest
    container_name: margin-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: margin_attribution
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      <<: *pgbackrest-environment

    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest archive-push %p
      - -c
      - archive_timeout=60s

    ports:
      - "5432:5432"

    volumes:
      - margin_postgres_data:/var/lib/postgresql/data
      - margin_postgres_socket:/var/run/postgresql

    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  pgbackrest-init:
    image: margin-postgres:17-pgbackrest
    restart: "no"
    user: postgres

    environment:
      <<: *pgbackrest-environment

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - margin_postgres_data:/var/lib/postgresql/data
      - margin_postgres_socket:/var/run/postgresql

    command:
      - sh
      - -ec
      - pgbackrest stanza-create && pgbackrest check

  minio:
    image: quay.io/minio/minio:latest
    container_name: margin-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - margin_minio_data:/data

volumes:
  margin_postgres_data:
  margin_postgres_socket:
  margin_minio_data:
